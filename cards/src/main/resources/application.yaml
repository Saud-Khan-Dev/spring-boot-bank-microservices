server:
  port: 9090
spring:
  application:
    name: cards
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import:
      - "application_prod.yml"
      - "application_qa.yml"

  profiles:
    active:
      - "qa"

build:
  info:
    name: cards
    version: 3.0.0

cards:
  message: "Welcome to the Cards Microservice Default APIs"
  contactDetails:
    name: "Saud"
    email: "saud@gmail.com"
  onCallSupport:
    - (555) 555-5555
    - (234) 234-0016
