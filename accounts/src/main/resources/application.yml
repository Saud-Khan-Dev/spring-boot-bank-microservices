# spring: 
#   application: 
#     name: accounts

server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console: 
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate: 
      ddl-auto: update
    show-sql: true

  config:
    import:
      - "application_prod.yml"
      - "application_qa.yml"  
  
  profiles:
    active:
      - "qa"

build:
  info:
    name: accounts
    version: 3.0.0

accounts:
  message: "Welcome to the Accounts Microservice Default APIs"
  contactDetails:
    name: "Saud"
    email: "saud@gmail.com"
  onCallSupport:
    - (555) 555-5555
    - (234) 234-0016
